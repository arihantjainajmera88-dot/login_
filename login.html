<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    


    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4>OTP Login</h4>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary w-100 mb-3" onclick="generateOTP()">Generate OTP</button>
                        <p id="showotp" class="text-center text-primary"></p>
                        <input type="text" id="name" class="form-control mb-3" placeholder="Enter user name">
                        <input type="text" id="pass" class="form-control mb-3" placeholder="Enter user password">
                        <input type="number" id="otp" class="form-control mb-3" placeholder="Enter OTP">
                        <button class="btn btn-success w-100" onclick="verifyOTP()">Verify OTP</button>
                        <p id="result" class="text-center mt-3"></p>
                    </div>
                </div>
        </div>
    </div>

    <script>
        let res;
        let pass ="Admin@1234"
        let name ="Arihant Jain"

        function generateOTP()
        {
            res = Math.floor(Math.random()*10000)+1;
            document.getElementById("showotp").innerHTML = "Your OTP: " + res;
        }

        function verifyOTP()
        {
            let n = parseInt(document.getElementById("otp").value);
            
            let p = document.getElementById("pass").value;
            let na = document.getElementById("name").value;

            if(res === n )
            {
                if( pass == p)
                {
                    if(name == na)
                    {
                        document.getElementById("result").innerHTML = "<span class='text-success'>Login Successful</span>";
                            setTimeout(
                                function()
                                {
                                    window.location.href="https://arihantjainajmera88-dot.github.io/profile/"
                                }, 2000);
                    }
                    else
                    {
                        document.getElementById("result").innerHTML = "<span class='text-danger'>Wrong name</span>";
                    }
                }
                else
                {
                    document.getElementById("result").innerHTML = "<span class='text-danger'>Wrong password</span>";
                }

            }
            else
            {
                document.getElementById("result").innerHTML = "<span class='text-danger'>Wrong OTP</span>";
            }
        }
</script>

</body>
</html>
